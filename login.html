<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Laundry</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        /* === GLOBALS === */
        :root {
            --brand-purple: #8B5CF6;
            --brand-purple-light: #A78BFA;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
            --bg-light: #FAFAFA;
        }
        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }
        * { box-sizing: border-box; }

        /* === SPLIT SCREEN LAYOUT === */
        .login-left {
            flex: 1;
            position: relative;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            z-index: 2;
        }
        .login-right {
            flex: 1.2;
            position: relative;
            overflow: hidden;
            box-shadow: -20px 0 50px rgba(0,0,0,0.1);
        }
        
        /* The Luxury Background Image */
        .login-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
        }

        /* === LOGIN FORM UI === */
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            background: #fff;
        }
        
        .header-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--brand-purple);
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 0.5px;
            margin-bottom: 50px;
            justify-content: center;
        }
        .logo-icon {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6, #F97316);
            color: white;
            width: 45px; height: 45px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold;
        }

        .login-header {
            margin-bottom: 40px;
            text-align: center;
        }
        .login-header h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 10px 0;
            color: var(--text-dark);
        }
        .login-header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 16px;
        }

        .input-group {
            margin-bottom: 24px;
        }
        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #4A5568;
        }
        .input-group input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1.5px solid #E2E8F0;
            background: #FAFAFA;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--brand-purple);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .checkbox-group input {
            accent-color: var(--brand-purple);
            width: 16px; height: 16px;
            cursor: pointer;
        }
        .forgot-link {
            color: var(--brand-purple);
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6, #F97316);
            color: white;
            font-weight: 800;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.2);
        }
        .submit-btn:hover {
            background: var(--brand-purple-light);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(139, 92, 246, 0.3);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--brand-purple);
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
                overflow: auto;
            }
            .login-right {
                flex: none;
                height: 300px;
                order: -1; /* Image on top for mobile */
            }
            .login-left {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-left">
        <div class="login-wrapper">
            <a href="index.html" class="header-logo">
                <div class="logo-icon">L</div>
                LAUNDRY
            </a>

            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Sign in to manage your premium laundry services.</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="hello@example.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <div class="login-options">
                    <label class="checkbox-group">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </div>

    <div class="login-right">
        <img src="login-bg.png" alt="Premium Luxury Laundry Towels">
    </div>

    <script>
        // Simple entrance animation
        gsap.from(".login-wrapper", { opacity: 0, y: 30, duration: 1, ease: "power3.out", delay: 0.2 });
        gsap.from(".login-right img", { scale: 1.1, duration: 2, ease: "power2.out" });
    </script>
</body>
</html>
